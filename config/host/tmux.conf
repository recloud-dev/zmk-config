bind-key -n S-F1 run-shell -b '"$HOME/.config/mriya/agent-keys.sh" next "#{pane_id}" "#{client_name}"'
bind-key -n S-F2 run-shell -b '"$HOME/.config/mriya/agent-keys.sh" list "#{pane_id}" "#{client_name}"'
bind-key -n S-F3 run-shell -b '"$HOME/.config/mriya/agent-keys.sh" back "#{pane_id}" "#{client_name}"'
bind-key -n S-F4 run-shell -b '"$HOME/.config/mriya/agent-keys.sh" monitor "#{pane_id}" "#{client_name}"'
bind-key -n S-F5 resize-pane -Z
bind-key -n S-F6 run-shell -b '"$HOME/.config/mriya/agent-keys.sh" model "#{pane_id}" "#{client_name}"'
bind-key -n S-F8 run-shell -b '"$HOME/.config/mriya/agent-keys.sh" less "#{pane_id}" "#{client_name}"'
bind-key -n S-F9 run-shell -b '"$HOME/.config/mriya/agent-keys.sh" more "#{pane_id}" "#{client_name}"'
